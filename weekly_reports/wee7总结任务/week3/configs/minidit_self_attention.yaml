paths:
  data_root: ../../week2/data_esc50_2mix
  sigma_stats_path: ../spectrogram/sigma_stats.json
  output_dir: ../runs/minidit_self_attention_v3

seed: 12345

audio:
  sample_rate: 16000
  duration: 5.0
  num_samples: 80000

spectrogram:
  representation: log_magnitude
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  center: true
  pad_mode: reflect
  normalized: false
  clamp_min: 0.0
  clamp_max: 1.0
  input_size: [513, 313]

dataset:
  class_names:
    - car_horn
    - chirping_birds
    - clock_tick
    - dog
    - door_wood_knock
    - glass_breaking
    - keyboard_typing
    - rain
    - siren
    - vacuum_cleaner

model:
  mixer_type: self_attention
  in_channels: 2
  out_channels: 1
  hidden_size: 192
  depth: 4
  num_heads: 6
  mlp_ratio: 4.0
  patch_size: [16, 16]
  dropout: 0.0

training:
  flow_start: mixture
  epochs: 40
  batch_size: 8
  num_workers: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  grad_clip_norm: 1.0
  use_amp: true
  velocity_loss_weight: 1.0
  endpoint_loss_weight: 1.0
  fixed_validation_seed: 20260516
  log_every_steps: 50
  save_every_epochs: 1
  max_train_steps: null
  max_val_steps: null
